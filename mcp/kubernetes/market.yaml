title: { zh: Kubernetes, en: Kubernetes }
description:
  zh: 管理 Kubernetes 集群资源、日志、端口转发与 Helm。
  en: Manage Kubernetes clusters, logs, port-forwarding, and Helm.
category: dev
version: 4.2.4
engines:
  primus: ">=0.1.7"
changelog:
  zh: 精简配置项，仅保留集群连接信息与简明说明。
  en: Simplified configuration to connection settings only and trimmed documentation.
icon: icon.png
runtime: node
entry: index.mjs
env:
  KUBECONFIG_PATH:
    label: { zh: Kubeconfig 路径, en: Kubeconfig Path }
    description:
      zh: 留空默认读取 ~/.kube/config
      en: Defaults to ~/.kube/config
    required: false
  K8S_SERVER:
    label: { zh: 集群地址, en: API Server URL }
    description:
      zh: 不使用 kubeconfig 时填写，如 https://host:6443
      en: Optional without kubeconfig, e.g. https://host:6443
    required: false
  K8S_TOKEN:
    label: { zh: 访问 Token, en: Bearer Token }
    description:
      zh: 配合集群地址使用
      en: Used with API Server URL
    required: false
    secret: true
