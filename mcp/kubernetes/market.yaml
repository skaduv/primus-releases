title: { zh: Kubernetes, en: Kubernetes }
description:
  zh: 管理 Kubernetes 集群资源、日志、端口转发与 Helm。
  en: Manage Kubernetes clusters, logs, port-forwarding, and Helm.
category: dev
version: 4.2.4
engines:
  primus: ">=0.1.7"
changelog:
  zh: 精简为连接地址、账号、密码三项配置，并缩减说明文字。
  en: Simplified settings to cluster address, username, and password/token, and trimmed documentation.
icon: icon.png
runtime: node
entry: index.mjs
env:
  K8S_SERVER:
    label: { zh: 集群地址, en: Cluster Address }
    description:
      zh: 留空默认读取 ~/.kube/config
      en: Leave empty to use ~/.kube/config
    required: false
  K8S_USERNAME:
    label: { zh: 账号, en: Username }
    required: false
  K8S_PASSWORD:
    label: { zh: 密码 / Token, en: Password / Token }
    description:
      zh: 留空账号时可作为 Token 使用
      en: Used as Bearer Token when username is empty
    required: false
    secret: true
